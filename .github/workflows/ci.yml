name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is advisory until a native Windows run is actually green. BrainGate already
    # fail-closes the Codex reviewer there (docs/DOGFOOD.md), and the rest of the suite has
    # never been exercised on win32, so a failure is information rather than a regression.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Windows runners default to core.autocrlf=true, which rewrites LF to CRLF on checkout and
      # makes git-diff and exact-content assertions fail for reasons unrelated to the code.
      - name: Keep line endings verbatim
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
