name: Feature request
description: Something BrainGate could do that would make your work easier.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where BrainGate got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you have in mind. A sketch of the session transcript is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
